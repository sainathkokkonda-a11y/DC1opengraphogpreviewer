<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Graph (OG) Previewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tool-card">
  <div class="tool-header">
    <h1>Open Graph (OG) Previewer</h1>
    <p>Check how your link looks when shared on social media</p>
  </div>

  <div class="tool-body">
    <div class="step-group">
      <label class="step-label">1. Enter Webpage URL</label>
      <input type="text" id="urlInput" placeholder="https://github.com">
    </div>

    <div class="btn-container">
      <button class="action-btn" onclick="fetchOgData()">Generate Preview</button>
    </div>

    <div class="loading-text" id="loading">Fetching Open Graph Data...</div>

    <div class="step-group" id="previewContainer">
      <label class="step-label" id="previewLabel" style="display:none;">2. Social Media Card Preview</label>
      <div class="preview-box" id="previewBox">
        <img id="ogImage" class="preview-img" src="" alt="OG Image Preview">
        <div class="preview-content">
          <div id="ogDomain" class="preview-domain">example.com</div>
          <h3 id="ogTitle" class="preview-title">Title will appear here</h3>
          <p id="ogDesc" class="preview-desc">Description will appear here...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
